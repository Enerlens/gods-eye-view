# God's Eye View — staging on the Enerlens VPS.
#
# Installed at /opt/gev/docker-compose.yml. The checkout it builds lives at
# /opt/gev/src and is moved around by gev-deploy.sh; this file never changes.
services:
  gev:
    build:
      context: ./src
      args:
        # Inlined into the browser bundle at build time, so they are build
        # args and not only runtime env (see `define` in vite.config.js).
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
    image: gev:staging
    container_name: gev
    restart: unless-stopped
    env_file: .env
    environment:
      # The chronicle records five feeds that publish only the present. Four of
      # them ride on fetches the server already makes and need no switch; the
      # QualiCharge charge-point poller is a NEW 112 MB/day of outbound traffic,
      # so it is opt-in everywhere and armed HERE — this is the deployment with
      # a persistent volume, and therefore the only one where the accumulation
      # is worth anything. Set CHRONICLE_IRVE_DYNAMIC=0 in .env to stop it.
      CHRONICLE_IRVE_DYNAMIC: ${CHRONICLE_IRVE_DYNAMIC:-1}
    ports:
      # Loopback for the Cloudflare tunnel, tailnet address for direct access.
      - "127.0.0.1:${GEV_PORT:-4173}:4173"
      - "${GEV_TAILSCALE_IP:-127.0.0.1}:${GEV_PORT:-4173}:4173"
    volumes:
      # Upstream response caches (Overpass, IRVE, schools…) survive redeploys.
      - gev-cache:/app/.gev-cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gev-cache:
