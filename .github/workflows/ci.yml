# Every PR and every push to main, on both supported Node majors.
#
# The fork ran without one for 119 commits: `npm test` was only ever green on
# the machine that wrote the change. The allocation microbenchmarks have
# budgets calibrated for Node 24 and skip themselves elsewhere, so 24 is the
# leg that enforces them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run setup policy checks
        run: npm run doctor -- --json

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  windows-onboarding:
    # The one platform this fork has never run on, and the only one where the
    # credential store's file permissions are enforced by an ACL rather than a
    # mode bit. Pinokio's install path is what a non-developer actually runs.
    name: Windows onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Run the Pinokio install path
        run: node scripts/pinokio-install.mjs

      - name: Run focused onboarding tests
        run: node --test src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/keySetupCore.test.mjs src/keySetupHardening.test.mjs

      - name: Build production bundle
        run: npm run build
